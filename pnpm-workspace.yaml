# Native dependencies whose install/build scripts we explicitly allow to run.
# pnpm blocks build scripts by default. `sharp` normalizes uploaded photos
# (features/applications/photos.ts) and needs no build: it ships prebuilt
# binaries as `@img/sharp-<platform>` optional dependencies. Our 0.35 has no
# install script at all; this entry is for the 0.34 copy Next depends on, whose
# script only compiles from source when no binary matches — which we never
# want on a deploy. So it stays disabled.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": true
  sharp: false
  # Downloads a platform binary used ONLY to upload source maps at build time.
  # Allowed so the upload works wherever SENTRY_AUTH_TOKEN is configured; the
  # upload itself stays off until it is (see next.config.ts), so this costs a
  # binary in node_modules and nothing else.
  "@sentry/cli": true
