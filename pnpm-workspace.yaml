# Native dependencies whose install/build scripts we explicitly allow to run.
# pnpm blocks build scripts by default. `sharp` (next/image optimization) is
# left disabled — unused for now.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": true
  sharp: false
  # Declined for now. @sentry/cli's postinstall downloads a platform binary used
  # ONLY to upload source maps at build time, which needs SENTRY_AUTH_TOKEN,
  # SENTRY_ORG and SENTRY_PROJECT — none of which are set. Error reporting works
  # without it; the cost is that production stack traces stay minified. Flip to
  # true when we wire source-map upload.
  "@sentry/cli": false
