# Native dependencies whose install/build scripts we explicitly allow to run.
# pnpm blocks build scripts by default. `sharp` (next/image optimization) is
# left disabled — unused for now.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  "@swc/core": true
  "@parcel/watcher": true
  sharp: false
  # Downloads a platform binary used ONLY to upload source maps at build time.
  # Allowed so the upload works wherever SENTRY_AUTH_TOKEN is configured; the
  # upload itself stays off until it is (see next.config.ts), so this costs a
  # binary in node_modules and nothing else.
  "@sentry/cli": true
